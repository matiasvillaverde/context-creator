# Supported configuration fields; priorities are first-match-wins.
ignore = ["*.log", "*.tmp", "*.cache", "vendor/", "node_modules/", "target/"]

[defaults]
max_tokens = 200000
llm_tool = "gemini"
tokenizer = "o200k-base"
output_reserve = 1000
secret_scan = "off"
progress = true
verbose = true
quiet = false
# model = "YOUR_MODEL" # omit to keep the provider CLI's configured default

[tokens]
gemini = 200000
codex = 100000
claude = 100000
ollama = 8192

[[priorities]]
pattern = "src/main.rs"
weight = 150

[[priorities]]
pattern = "src/lib.rs"
weight = 140

[[priorities]]
pattern = "src/api/**"
weight = 120

[[priorities]]
pattern = "src/core/**"
weight = 110

[[priorities]]
pattern = "src/**"
weight = 100

[[priorities]]
pattern = "Cargo.toml"
weight = 90

[[priorities]]
pattern = "**/*.md"
weight = 70

[[priorities]]
pattern = "tests/**"
weight = 50
