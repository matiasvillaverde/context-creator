[package]
name = "context-creator"
version = "1.6.0"
edition = "2021"
rust-version = "1.89"
description = "High-performance CLI tool to convert codebases to Markdown for LLM context"
authors = ["Matias Villaverde"]
repository = "https://github.com/matiasvillaverde/context-creator"
license = "MIT"
keywords = ["cli", "llm", "code", "context", "markdown"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
arboard = "3.2"
clap = { version = "4.5", features = ["derive"] }
dashmap = "5.5"
dirs = "5.0"
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }
glob = "0.3"
ignore = "0.4"
itertools = "0.13"
rayon = "1.10"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "1.0"
tiktoken-rs = "0.5.9"
toml = "0.8"
tree-sitter = "0.26.13"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-swift = "0.7.4"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.25.1"
tree-sitter-zig = "1.1.2"
walkdir = "2.5"
deadpool = "0.10"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
moka = { version = "0.12", features = ["future"] }
num_cpus = "1.16"
petgraph = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rmcp = { version = "3.7.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
jsonrpsee = { version = "0.26", features = ["server", "http-client", "macros"] }
schemars = "1"
axum = "0.8"
hyper = "1.0"
hyper-util = "0.1"
tower-service = "0.3"
tower = { version = "0.4", features = ["full"] }
# OTLP parsing dependencies
prost = "0.12"
prost-types = "0.12"
tree-sitter-bash = "0.25.1"
tree-sitter-dart = "0.3.0"
tree-sitter-lua = "0.5.0"
tree-sitter-scala = "0.26.3"
tree-sitter-elixir = "0.3.5"
tree-sitter-r = "1.3.0"
tree-sitter-julia = "0.23.1"
tree-sitter-haskell = "0.24.1"
tree-sitter-clojure-orchard = "0.2.8"
tree-sitter-powershell = "0.26.4"
tree-sitter-sequel = "0.3.11"
tree-sitter-perl = { package = "ts-parser-perl", version = "2.0.0" }
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"

[dev-dependencies]
assert_cmd = "2.0"
criterion = { version = "0.5", features = ["html_reports"] }
predicates = "3.1"
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.test]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "type_resolution_bench"
harness = false
